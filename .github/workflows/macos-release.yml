name: macOS release binaries

# Compile Fairy-Stockfish pour macOS (Intel + Apple Silicon) à partir du
# dernier commit de la branche, et ajoute les binaires à une release GitHub.
#
# - Automatique : à chaque push sur la branche mac qui touche src/ ou ce fichier
#   (fonctionne même si ce fichier n'est pas sur master).
# - Manuel : onglet Actions > "macOS release binaries" > Run workflow
#   (ce bouton n'apparaît que si ce fichier est AUSSI sur master ;
#   choisir alors la branche à compiler dans « Use workflow from »).

on:
  push:
    branches: [ mac ]
    paths:
      - "src/**"
      - ".github/workflows/macos-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release (tag existant) qui reçoit les binaires"
        required: true
        default: "1035"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || '1035' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            os: macos-15-intel
            suffix: macos-x86-64
          - arch: apple-silicon
            os: macos-15
            suffix: macos-apple-silicon
    runs-on: ${{ matrix.os }}

    steps:
      # Sans "ref" : le commit qui a déclenché le workflow (dernier de la branche)
      - uses: actions/checkout@v7

      - name: Version compilée
        run: git log -1 --format='%H %s'

      - name: Compilation (standard, largeboards, all)
        working-directory: src
        run: |
          set -e
          build() {
            exe="$1"; shift
            make clean
            make -j"$(sysctl -n hw.ncpu)" build COMP=clang ARCH=${{ matrix.arch }} EXE="$exe" "$@"
            strip "$exe"
            # strip invalide la signature ad hoc : obligatoire sur Apple Silicon
            codesign --force --sign - "$exe"
            printf 'uci\nquit\n' | ./"$exe" | grep -q uciok
            mv "$exe" ../dist/
          }
          mkdir -p ../dist
          build fairy-stockfish_${{ matrix.suffix }}
          build fairy-stockfish-largeboards_${{ matrix.suffix }} largeboards=yes
          build fairy-stockfish-all_${{ matrix.suffix }} largeboards=yes all=yes
          ls -l ../dist && file ../dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: fairy-stockfish-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Ajout à la release ${{ env.TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
